name: "Issue & PR Management Bot"

on:
  schedule:
  - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This clinical issue has been automatically marked as stale due to inactivity.'
        stale-pr-message: 'This PR has been marked stale pending automated safety compliance approval.'
        stale-issue-label: 'status:stale'
        stale-pr-label: 'status:stale'
        days-before-stale: 30
        days-before-close: 7
